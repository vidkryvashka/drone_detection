dim_coefficient = 0					# 0 - 16 value, 0 is black img output, points only, default 2

fast9_threshold = 40				# max 2D distance (img diagonal percent) between points to attribute the point to the cluster, default 4

[dbscan]
max_distance = 3.0 					# max 2D diagonal % distance between points to attribute the point to the cluster
min_cluster_size = 3				# min points number in cluster, default 3
min_clusters_count_merge = 24		# min cluster count to recursively merge some of them reducing count, dafault 24
enable_geometric_filtering = false	# may be excessive for optical flow calculate, default off

[track]
max_distance = 1.8					# the maximum distance in diagonal % that an object can move in 1 frame, default 1.8
max_missed = 5						# how many frames to wait before deleting a lost track, default 5
deviation_squared_threshold = 8		# to find point with too deviative trajectory, default 8
prediction_steps = 5				# number of future frames to predict trajectory curve (e.g. 3 - 5), default 5
